<!--
  Componente: Pill Buttons (Botões Pílula)
  Descrição: Botões ovais refinados com espaçamento entre letras generoso (tracking 0.24em a 0.3em) e micro-interação ao passar o cursor.
-->

<!-- 1. Botão Pílula Outline Claro (Light Theme) -->
<a href="#visit" class="koisei-btn koisei-btn-outline-light">
  Visit
</a>

<!-- 2. Botão Pílula Outline Escuro com Ícone (Dark Theme) -->
<button class="koisei-btn koisei-btn-outline-dark group">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="transition-transform duration-300 group-hover:-translate-y-0.5">
    <path d="M12 19V5M5 12l7-7 7 7"/>
  </svg>
  Begin Again
</button>

<!-- 3. Botão Pílula Preenchido Vermelho Akane -->
<button class="koisei-btn koisei-btn-filled-akane">
  Enter Atelier
</button>

<!-- 4. Link Editorial com Linha de Tinta Expansível -->
<a href="#river" class="link-ink-underline text-xs uppercase tracking-[0.28em] text-[#5d574b]">
  River
</a>

<!-- 5. Link com Seta Indicativa Lateral -->
<a href="#temple" class="group inline-flex items-center gap-3 text-xs uppercase tracking-[0.3em] text-[#f4eee3] transition-transform duration-300 hover:-translate-y-0.5">
  <span class="link-ink-underline">Follow the water</span>
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="transition-transform duration-300 group-hover:translate-x-1">
    <path d="M5 12h14M12 5l7 7-7 7"/>
  </svg>
</a>
