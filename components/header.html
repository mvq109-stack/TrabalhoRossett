<!--
  Componente: Adaptive Navigation Header (Cabeçalho Adaptativo)
  Descrição: Barra de navegação fixa que se adapta suavemente (duração de 700ms) entre modos claro e escuro dependendo da seção visível na tela.
-->

<header id="siteHeader" class="koisei-header">
  <div class="koisei-header-inner">
    <!-- Logotipo com Selo Hanko e Nome da Marca -->
    <a href="#top" class="koisei-brand">
      <span class="koisei-seal koisei-seal-sm">
        <span>鯉</span>
      </span>
      <span id="brandText" class="koisei-brand-text">Koisei</span>
    </a>

    <!-- Navegação de Links Centrais -->
    <nav id="navLinks" class="koisei-nav">
      <a href="#river" class="link-ink-underline">River</a>
      <a href="#temple" class="link-ink-underline">Temple</a>
      <a href="#lantern" class="link-ink-underline">Lantern</a>
    </nav>

    <!-- Botão de Ação / Chamada -->
    <a href="#night" id="visitBtn" class="koisei-btn koisei-btn-outline-light">
      Visit
    </a>
  </div>
</header>
