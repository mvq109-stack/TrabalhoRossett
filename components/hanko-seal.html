<!--
  Componente: Hanko Seal Stamp (印鑑 / 判子)
  Descrição: Selo de carimbo tradicional japonês em vermelho laca (Akane) com kanji tipográfico (Shippori Mincho).
  Uso: Identidade de marca, âncora de seções, assinaturas e selos de validação.
-->

<!-- 1. Selo Pequeno (Header / Marca) - 32x32px -->
<span class="koisei-seal koisei-seal-sm">
  <span>鯉</span> <!-- Koi -->
</span>

<!-- 2. Selo Médio (Poema / Cartão) - 40x40px -->
<span class="seal koisei-seal koisei-seal-md">
  <span>流</span> <!-- Flow / Current -->
</span>

<!-- 3. Selo Grande (Hero / Âncora) - 44x44px -->
<span class="seal koisei-seal koisei-seal-lg">
  <span>水</span> <!-- Water -->
</span>

<!-- 4. Selo Extra Grande (Conclusão / Night) - 56x56px -->
<span class="seal koisei-seal koisei-seal-xl">
  <span>夜</span> <!-- Night -->
</span>

<!-- Versão com Tailwind CSS Puro (Sem classes customizadas) -->
<span class="flex items-center justify-center w-11 h-11 rounded-[3px] shadow-md transition-all duration-500" style="background:#9c2d24;">
  <span class="text-sm text-[#f4eee3]" style="font-family:'Shippori Mincho',serif;">水</span>
</span>
